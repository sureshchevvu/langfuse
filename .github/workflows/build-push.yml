name: Langfuse Multi-Service Build & Push to ECR

on:
  push:
    branches:
      - chevvu/dev
      - chevvu/np
      - chevvu/prod
    paths-ignore:
      - "**/*.md"
      - ".github/*"
      - ".gitignore"
      - "*.config.js"

jobs:
  setup:
    name: 🔧 Environment Setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      build-id: ${{ steps.set-env.outputs.build-id }}
      aws-region: ${{ steps.set-env.outputs.aws-region }}
      aws-account: ${{ steps.set-env.outputs.aws-account }}
      aws-role: ${{ steps.set-env.outputs.aws-role }}
    steps:
      - name: 🔧 Set Environment Variables
        id: set-env
        run: |
          BUILD_ID="${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-7)"
          BRANCH="${{ github.ref_name }}"
          
          echo "build-id=${BUILD_ID}" >> $GITHUB_OUTPUT
          
          case "$BRANCH" in
            "chevvu/dev")
              echo "environment=dev" >> $GITHUB_OUTPUT
              echo "aws-region=${{ secrets.DEV_AWS_REGION }}" >> $GITHUB_OUTPUT
              echo "aws-account=${{ secrets.DEV_AWS_ACCOUNT_ID }}" >> $GITHUB_OUTPUT
              echo "aws-role=${{ secrets.DEV_AWS_ROLE_NAME }}" >> $GITHUB_OUTPUT
              echo "🔵 Environment: dev"
              ;;
            "chevvu/np")
              echo "environment=np" >> $GITHUB_OUTPUT
              echo "aws-region=${{ secrets.NP_AWS_REGION }}" >> $GITHUB_OUTPUT
              echo "aws-account=${{ secrets.NP_AWS_ACCOUNT_ID }}" >> $GITHUB_OUTPUT
              echo "aws-role=${{ secrets.NP_AWS_ROLE_NAME }}" >> $GITHUB_OUTPUT
              echo "🟡 Environment: np"
              ;;
            "chevvu/prod")
              echo "environment=prod" >> $GITHUB_OUTPUT
              echo "aws-region=${{ secrets.PROD_AWS_REGION }}" >> $GITHUB_OUTPUT
              echo "aws-account=${{ secrets.PROD_AWS_ACCOUNT_ID }}" >> $GITHUB_OUTPUT
              echo "aws-role=${{ secrets.PROD_AWS_ROLE_NAME }}" >> $GITHUB_OUTPUT
              echo "🔴 Environment: prod"
              ;;
            *)
              echo "❌ Unknown branch: $BRANCH"
              exit 1
              ;;
          esac

      - name: 🔍 Verify Outputs
        run: |
          echo "Environment: ${{ steps.set-env.outputs.environment }}"
          echo "Build ID: ${{ steps.set-env.outputs.build-id }}"
          echo "AWS Region: ${{ steps.set-env.outputs.aws-region }}"
          echo "AWS Account: ${{ steps.set-env.outputs.aws-account }}"
          echo "AWS Role: ${{ steps.set-env.outputs.aws-role }}"

  build-and-push:
    name: 🏗️ ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: langfuse-web
            dockerfile: ./Dockerfile
            context: .
          - name: langfuse-worker
            dockerfile: ./Dockerfile
            context: .
          - name: langfuse-postgres
            base-image: postgres:17
          - name: langfuse-redis
            base-image: redis:7
          - name: langfuse-minio
            base-image: minio/minio:latest
          - name: langfuse-clickhouse
            base-image: clickhouse/clickhouse-server:latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔍 Debug - Verify Job Inputs
        run: |
          echo "Environment: ${{ needs.setup.outputs.environment }}"
          echo "Build ID: ${{ needs.setup.outputs.build-id }}"
          echo "AWS Region: ${{ needs.setup.outputs.aws-region }}"
          echo "AWS Account: ${{ needs.setup.outputs.aws-account }}"
          echo "AWS Role: ${{ needs.setup.outputs.aws-role }}"
          echo "Role ARN: arn:aws:iam::${{ needs.setup.outputs.aws-account }}:role/${{ needs.setup.outputs.aws-role }}"

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.setup.outputs.aws-account }}:role/${{ needs.setup.outputs.aws-role }}
          aws-region: ${{ needs.setup.outputs.aws-region }}
          role-duration-seconds: 3600

      - name: 🔑 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📋 Set Image Names
        id: image-names
        env:
          ENV: ${{ needs.setup.outputs.environment }}
          BUILD_ID: ${{ needs.setup.outputs.build-id }}
          SERVICE: ${{ matrix.service.name }}
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO_NAME="${ENV}-${SERVICE}"
          IMAGE_TAG="${ENV}-${BUILD_ID}"
          
          echo "ecr-repo=${REPO_NAME}" >> $GITHUB_OUTPUT
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "full-image=${ECR_REGISTRY}/${REPO_NAME}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "latest-image=${ECR_REGISTRY}/${REPO_NAME}:latest" >> $GITHUB_OUTPUT
          
          echo "📦 Building: ${REPO_NAME}:${IMAGE_TAG}"

      - name: 📦 Create Dockerfile for Base Images
        if: matrix.service.base-image
        run: |
          mkdir -p ./temp-${{ matrix.service.name }}
          cat > ./temp-${{ matrix.service.name }}/Dockerfile <<'EOF'
          FROM ${{ matrix.service.base-image }}
          LABEL service="${{ matrix.service.name }}"
          LABEL environment="${{ needs.setup.outputs.environment }}"
          LABEL build-id="${{ needs.setup.outputs.build-id }}"
          EOF

      - name: 🔍 Ensure ECR Repository Exists
        env:
          REPO_NAME: ${{ steps.image-names.outputs.ecr-repo }}
        run: |
          if ! aws ecr describe-repositories --repository-names "$REPO_NAME" --region ${{ needs.setup.outputs.aws-region }} &>/dev/null; then
            echo "📦 Creating ECR repository: $REPO_NAME"
            aws ecr create-repository \
              --repository-name "$REPO_NAME" \
              --region ${{ needs.setup.outputs.aws-region }} \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256
          else
            echo "✅ ECR repository exists: $REPO_NAME"
          fi

      - name: 🏗️ Build and Push Docker Image (App Services)
        if: ${{ !matrix.service.base-image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ steps.image-names.outputs.full-image }}
            ${{ steps.image-names.outputs.latest-image }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          build-args: |
            NEXT_PUBLIC_LANGFUSE_CLOUD_REGION=${{ needs.setup.outputs.aws-region }}
            NODE_ENV=production

      - name: 🏗️ Build and Push Docker Image (Base Images)
        if: matrix.service.base-image
        uses: docker/build-push-action@v5
        with:
          context: ./temp-${{ matrix.service.name }}
          file: ./temp-${{ matrix.service.name }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image-names.outputs.full-image }}
            ${{ steps.image-names.outputs.latest-image }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: ✅ Verify Image Push
        run: |
          echo "🔍 Verifying image in ECR..."
          aws ecr describe-images \
            --repository-name "${{ steps.image-names.outputs.ecr-repo }}" \
            --image-ids imageTag="${{ steps.image-names.outputs.image-tag }}" \
            --region ${{ needs.setup.outputs.aws-region }} \
            --query 'imageDetails[0].[imageTags,imagePushedAt,imageSizeInBytes]' \
            --output table

      - name: 📊 Image Summary
        run: |
          echo "### 📦 ${{ matrix.service.name }} Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build ID**: ${{ needs.setup.outputs.build-id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ steps.image-names.outputs.full-image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest**: \`${{ steps.image-names.outputs.latest-image }}\`" >> $GITHUB_STEP_SUMMARY

  summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs: [setup, build-and-push]
    if: always()
    steps:
      - name: 📋 Generate Summary
        run: |
          echo "## 🚀 Langfuse Multi-Service Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build ID**: ${{ needs.setup.outputs.build-id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **AWS Region**: ${{ needs.setup.outputs.aws-region }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ needs.build-and-push.result }}" >> $GITHUB_STEP_SUMMARY