name: Langfuse Multi-Service Build & Push to ECR

on:
  push:
    branches:
      - chevvu/dev
      - chevvu/np
      - chevvu/prod
    paths-ignore:
      - "**/*.md"
      - ".github/*"
      - ".gitignore"
      - "*.config.js"

jobs:
  setup:
    name: 🔧 Environment Setup
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env-config.outputs.ENVIRONMENT }}
      build-id: ${{ steps.generate-id.outputs.unique-id }}
      aws-region: ${{ steps.env-config.outputs.AWS_REGION }}
      aws-account: ${{ steps.env-config.outputs.AWS_ACCOUNT }}
      aws-role: ${{ steps.env-config.outputs.AWS_ROLE }}  # ADD THIS
    steps:
      - name: 🎲 Generate Build ID
        id: generate-id
        run: |
          BUILD_ID="${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "unique-id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "✅ Generated Build ID: $BUILD_ID"

      - name: 🔧 Determine Environment
        id: env-config
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          echo "🌿 Push branch: $BRANCH"

          case "$BRANCH" in
            "chevvu/dev")
              echo "ENVIRONMENT=dev" >> $GITHUB_OUTPUT
              echo "AWS_REGION=${{ secrets.DEV_AWS_REGION }}" >> $GITHUB_OUTPUT
              echo "AWS_ACCOUNT=${{ secrets.DEV_AWS_ACCOUNT_ID }}" >> $GITHUB_OUTPUT
              echo "AWS_ROLE=${{ secrets.DEV_AWS_ROLE_NAME }}" >> $GITHUB_OUTPUT  # ADD THIS
              echo "🔵 Environment: dev"
              ;;
            "chevvu/np")
              echo "ENVIRONMENT=np" >> $GITHUB_OUTPUT
              echo "AWS_REGION=${{ secrets.NP_AWS_REGION }}" >> $GITHUB_OUTPUT
              echo "AWS_ACCOUNT=${{ secrets.NP_AWS_ACCOUNT_ID }}" >> $GITHUB_OUTPUT
              echo "AWS_ROLE=${{ secrets.NP_AWS_ROLE_NAME }}" >> $GITHUB_OUTPUT  # ADD THIS
              echo "🟡 Environment: NP"
              ;;
            "chevvu/prod")
              echo "ENVIRONMENT=prod" >> $GITHUB_OUTPUT
              echo "AWS_REGION=${{ secrets.PROD_AWS_REGION }}" >> $GITHUB_OUTPUT
              echo "AWS_ACCOUNT=${{ secrets.PROD_AWS_ACCOUNT_ID }}" >> $GITHUB_OUTPUT
              echo "AWS_ROLE=${{ secrets.PROD_AWS_ROLE_NAME }}" >> $GITHUB_OUTPUT  # ADD THIS
              echo "🔴 Environment: Production"
              ;;
            *)
              echo "❌ Unknown branch: $BRANCH"
              exit 1
              ;;
          esac

  build-and-push:
    name: 🏗️ Build & Push All Services
    runs-on: ubuntu-latest
    needs: [setup]
    strategy:
      matrix:
        service:
          - name: langfuse-web
            dockerfile: ./web/Dockerfile
            context: .
          - name: langfuse-worker
            dockerfile: ./worker/Dockerfile
            context: .
          - name: langfuse-postgres
            dockerfile: ./postgres/Dockerfile
            context: ./postgres
            base-image: postgres:17
          - name: langfuse-redis
            dockerfile: ./redis/Dockerfile
            context: ./redis
            base-image: redis:7
          - name: langfuse-minio
            dockerfile: ./minio/Dockerfile
            context: ./minio
            base-image: minio/minio
          - name: langfuse-clickhouse
            dockerfile: ./clickhouse/Dockerfile
            context: ./clickhouse
            base-image: clickhouse/clickhouse-server
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.setup.outputs.aws-account }}:role/${{ needs.setup.outputs.aws-role }}  # CHANGE THIS
          aws-region: ${{ needs.setup.outputs.aws-region }}
          role-duration-seconds: 3600

      - name: 🔑 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📋 Set Image Names
        id: image-names
        env:
          ENV: ${{ needs.setup.outputs.environment }}
          BUILD_ID: ${{ needs.setup.outputs.build-id }}
          SERVICE: ${{ matrix.service.name }}
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO_NAME="${ENV}-${SERVICE}"
          IMAGE_TAG="${ENV}-${BUILD_ID}"
          
          echo "ecr-repo=${REPO_NAME}" >> $GITHUB_OUTPUT
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "full-image=${ECR_REGISTRY}/${REPO_NAME}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "latest-image=${ECR_REGISTRY}/${REPO_NAME}:latest" >> $GITHUB_OUTPUT

      - name: 📦 Create Dockerfile if Base Image
        if: matrix.service.base-image
        run: |
          mkdir -p ${{ matrix.service.context }}
          cat > ${{ matrix.service.dockerfile }} <<EOF
          FROM ${{ matrix.service.base-image }}
          LABEL service="${{ matrix.service.name }}"
          LABEL environment="${{ needs.setup.outputs.environment }}"
          LABEL build-id="${{ needs.setup.outputs.build-id }}"
          EOF

      - name: 🔍 Ensure ECR Repository Exists
        env:
          REPO_NAME: ${{ steps.image-names.outputs.ecr-repo }}
        run: |
          set +e
          aws ecr describe-repositories --repository-names "$REPO_NAME" --region ${{ needs.setup.outputs.aws-region }} >/dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "📦 Creating ECR repository: $REPO_NAME"
            aws ecr create-repository \
              --repository-name "$REPO_NAME" \
              --region ${{ needs.setup.outputs.aws-region }} \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256
          else
            echo "✅ ECR repository exists: $REPO_NAME"
          fi
          set -e

      - name: 🏗️ Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ steps.image-names.outputs.full-image }}
            ${{ steps.image-names.outputs.latest-image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_LANGFUSE_CLOUD_REGION=${{ needs.setup.outputs.aws-region }}

      - name: ✅ Verify Image Push
        env:
          REPO_NAME: ${{ steps.image-names.outputs.ecr-repo }}
          IMAGE_TAG: ${{ steps.image-names.outputs.image-tag }}
        run: |
          echo "🔍 Verifying image in ECR..."
          aws ecr describe-images \
            --repository-name "$REPO_NAME" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region ${{ needs.setup.outputs.aws-region }} \
            --query 'imageDetails[0].[imageTags,imagePushedAt,imageSizeInBytes]' \
            --output table

      - name: 📊 Image Summary
        run: |
          echo "### 📦 ${{ matrix.service.name }} Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build ID**: ${{ needs.setup.outputs.build-id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ steps.image-names.outputs.full-image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest**: \`${{ steps.image-names.outputs.latest-image }}\`" >> $GITHUB_STEP_SUMMARY

  summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs: [setup, build-and-push]
    if: always()
    steps:
      - name: 📋 Generate Summary
        run: |
          echo "## 🚀 Langfuse Multi-Service Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build ID**: ${{ needs.setup.outputs.build-id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **AWS Region**: ${{ needs.setup.outputs.aws-region }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🐳 Built Services" >> $GITHUB_STEP_SUMMARY
          echo "- langfuse-web" >> $GITHUB_STEP_SUMMARY
          echo "- langfuse-worker" >> $GITHUB_STEP_SUMMARY
          echo "- langfuse-postgres" >> $GITHUB_STEP_SUMMARY
          echo "- langfuse-redis" >> $GITHUB_STEP_SUMMARY
          echo "- langfuse-minio" >> $GITHUB_STEP_SUMMARY
          echo "- langfuse-clickhouse" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 ECR Repositories" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.setup.outputs.environment }}-langfuse-web" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.setup.outputs.environment }}-langfuse-worker" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.setup.outputs.environment }}-langfuse-postgres" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.setup.outputs.environment }}-langfuse-redis" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.setup.outputs.environment }}-langfuse-minio" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.setup.outputs.environment }}-langfuse-clickhouse" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY