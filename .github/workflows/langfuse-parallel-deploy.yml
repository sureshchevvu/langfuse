          fi

  deploy-web:
    name: 🌐 Deploy Web Service
    needs: [prepare, deploy-redis, deploy-clickhouse, deploy-minio]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT: ${{ needs.prepare.outputs.env }}
      IMAGE_TAG: ${{ needs.prepare.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.DEV_AWS_REGION }}

      - name: Get image URI
        id: image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION=$(aws configure get region || echo "us-east-1")
          ENV="${{ env.ENVIRONMENT }}"
          REPO="${ENV}-langfuse-web"
          IMAGE="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${REPO}:latest"
          echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT
          echo "📦 Web Image: $IMAGE"

      - name: Get ECS service details and load secrets
        id: ecs
        run: |
          BRANCH="${{ needs.prepare.outputs.branch }}"
          ENV="${{ env.ENVIRONMENT }}"
          
          case "$ENV" in
            dev)
              CLUSTER="${{ secrets.DEV_ECS_CLUSTER_NAME }}"
              SERVICE="${{ secrets.DEV_WEB_SERVICE }}"
              DB_SECRET_ARN="arn:aws:secretsmanager:us-east-1:203874373410:secret:dev/langfuse/database-url-TrrygY"
              ENCRYPTION_SECRET_ARN="${{ secrets.DEV_ENCRYPTION_SECRET_ARN }}"
              NEXTAUTH_SECRET_ARN="${{ secrets.DEV_NEXTAUTH_SECRET_ARN }}"
              REDIS_SECRET_ARN="${{ secrets.DEV_REDIS_SECRET_ARN }}"
              CLICKHOUSE_SECRET_ARN="${{ secrets.DEV_CLICKHOUSE_SECRET_ARN }}"
              S3_SECRET_ARN="${{ secrets.DEV_S3_SECRET_ARN }}"
              ;;
            np)
              CLUSTER="${{ secrets.NP_ECS_CLUSTER_NAME }}"
              SERVICE="${{ secrets.NP_WEB_SERVICE }}"
              DB_SECRET_ARN="${{ secrets.NP_DATABASE_URL_SECRET_ARN }}"
              ENCRYPTION_SECRET_ARN="${{ secrets.NP_ENCRYPTION_SECRET_ARN }}"
              NEXTAUTH_SECRET_ARN="${{ secrets.NP_NEXTAUTH_SECRET_ARN }}"
              REDIS_SECRET_ARN="${{ secrets.NP_REDIS_SECRET_ARN }}"
              CLICKHOUSE_SECRET_ARN="${{ secrets.NP_CLICKHOUSE_SECRET_ARN }}"
              S3_SECRET_ARN="${{ secrets.NP_S3_SECRET_ARN }}"
              ;;
            prod)
              CLUSTER="${{ secrets.PROD_ECS_CLUSTER_NAME }}"
              SERVICE="${{ secrets.PROD_WEB_SERVICE }}"
              DB_SECRET_ARN="${{ secrets.PROD_DATABASE_URL_SECRET_ARN }}"
              ENCRYPTION_SECRET_ARN="${{ secrets.PROD_ENCRYPTION_SECRET_ARN }}"
              NEXTAUTH_SECRET_ARN="${{ secrets.PROD_NEXTAUTH_SECRET_ARN }}"
              REDIS_SECRET_ARN="${{ secrets.PROD_REDIS_SECRET_ARN }}"
              CLICKHOUSE_SECRET_ARN="${{ secrets.PROD_CLICKHOUSE_SECRET_ARN }}"
              S3_SECRET_ARN="${{ secrets.PROD_S3_SECRET_ARN }}"
              ;;
          esac
          
          echo "CLUSTER=$CLUSTER" >> $GITHUB_OUTPUT
          echo "SERVICE=$SERVICE" >> $GITHUB_OUTPUT
          
          # Build secrets JSON
          jq -n \
            --arg db "$DB_SECRET_ARN" \
            --arg encryption "$ENCRYPTION_SECRET_ARN" \
            --arg nextauth "$NEXTAUTH_SECRET_ARN" \
            --arg redis "$REDIS_SECRET_ARN" \
            --arg clickhouse "$CLICKHOUSE_SECRET_ARN" \
            --arg s3 "$S3_SECRET_ARN" \
            '[
              {"name":"DATABASE_URL","valueFrom":$db},
              {"name":"ENCRYPTION_KEY","valueFrom":($encryption + ":encryption_key::")},
              {"name":"SALT","valueFrom":($encryption + ":salt::")},
              {"name":"NEXTAUTH_SECRET","valueFrom":($nextauth + ":secret::")},
              {"name":"REDIS_AUTH","valueFrom":($redis + ":password::")},
              {"name":"CLICKHOUSE_PASSWORD","valueFrom":($clickhouse + ":password::")},
              {"name":"LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID","valueFrom":($s3 + ":access_key::")},
              {"name":"LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY","valueFrom":($s3 + ":secret_key::")},
              {"name":"LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID","valueFrom":($s3 + ":access_key::")},
              {"name":"LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY","valueFrom":($s3 + ":secret_key::")},
              {"name":"LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID","valueFrom":($s3 + ":access_key::")},
              {"name":"LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY","valueFrom":($s3 + ":secret_key::")}
            ]' > web-secrets.json
          
          echo "✅ Built secrets configuration"

      - name: Load environment variables from file
        run: |
          BRANCH="${{ needs.prepare.outputs.branch }}"
          ENV_FILE=".github/envs/${BRANCH}.env"
          
          if [ ! -f "$ENV_FILE" ]; then
            echo "❌ Env file not found: $ENV_FILE"
            exit 1
          fi
          
          # Parse env file to JSON - filter out comments and empty lines
          echo "[]" > env_vars.json
          while IFS='=' read -r key value; do
            # Skip comments and empty lines
            if [[ "$key" =~ ^#.* ]] || [ -z "$key" ]; then
              continue
            fi
            # Skip if no value
            if [ -z "$value" ]; then
              continue
            fi
            # Add to JSON array
            jq --arg k "$key" --arg v "$value" '. += [{"name": $k, "value": $v}]' env_vars.json > env_vars_tmp.json
            mv env_vars_tmp.json env_vars.json
          done < "$ENV_FILE"
          
          echo "✅ Loaded environment variables"

      - name: Update web service
        run: |
          CLUSTER="${{ steps.ecs.outputs.CLUSTER }}"
          SERVICE="${{ steps.ecs.outputs.SERVICE }}"
          NEW_IMAGE="${{ steps.image.outputs.IMAGE }}"
          ENV="${{ env.ENVIRONMENT }}"
          BUILD="${{ github.run_number }}"
          
          # Get current task definition
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query taskDefinition > current-task-def.json
          
          # Load configs
          ENV_VARS_JSON=$(cat env_vars.json)
          SECRETS_JSON=$(cat web-secrets.json)
          
          # Update task definition
          jq --arg IMG "$NEW_IMAGE" \
             --arg ENV "$ENV" \
             --arg BUILD "$BUILD" \
             --argjson ENV_VARS "$ENV_VARS_JSON" \
             --argjson SECRETS "$SECRETS_JSON" '
            .containerDefinitions = (.containerDefinitions | map(
              .image = $IMG |
              .environment = $ENV_VARS + [
                {"name":"APP_ENV","value":$ENV},
                {"name":"BUILD_NUMBER","value":$BUILD},
                {"name":"ENVIRONMENT","value":$ENV}
              ] |
              .secrets = $SECRETS
            )) |
            del(.taskDefinitionArn, .revision, .status, .registeredAt, .registeredBy, .compatibilities, .requiresAttributes, .placementConstraints)
          ' current-task-def.json > new-task-def.json
          
          # Register and update
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$NEW_TASK_DEF_ARN" \
            --force-new-deployment \
            --no-cli-pager
          
          echo "✅ Web service updated"

  deploy-worker:
    name: 👷 Deploy Worker Service
    needs: [prepare, deploy-redis, deploy-clickhouse, deploy-minio]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT: ${{ needs.prepare.outputs.env }}
      IMAGE_TAG: ${{ needs.prepare.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.DEV_AWS_REGION }}

      - name: Get image URI
        id: image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION=$(aws configure get region || echo "us-east-1")
          ENV="${{ env.ENVIRONMENT }}"
          REPO="${ENV}-langfuse-worker"
          IMAGE="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${REPO}:latest"
          echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT
          echo "📦 Worker Image: $IMAGE"

      - name: Get ECS service details and load secrets
        id: ecs
        run: |
          BRANCH="${{ needs.prepare.outputs.branch }}"
          ENV="${{ env.ENVIRONMENT }}"
          
          case "$ENV" in
            dev)
              CLUSTER="${{ secrets.DEV_ECS_CLUSTER_NAME }}"
              SERVICE="${{ secrets.DEV_WORKER_SERVICE }}"
              DB_SECRET_ARN="arn:aws:secretsmanager:us-east-1:203874373410:secret:dev/langfuse/database-url-TrrygY"
              ENCRYPTION_SECRET_ARN="${{ secrets.DEV_ENCRYPTION_SECRET_ARN }}"
              NEXTAUTH_SECRET_ARN="${{ secrets.DEV_NEXTAUTH_SECRET_ARN }}"
              REDIS_SECRET_ARN="${{ secrets.DEV_REDIS_SECRET_ARN }}"
              CLICKHOUSE_SECRET_ARN="${{ secrets.DEV_CLICKHOUSE_SECRET_ARN }}"
              S3_SECRET_ARN="${{ secrets.DEV_S3_SECRET_ARN }}"
              ;;
            np)
              CLUSTER="${{ secrets.NP_ECS_CLUSTER_NAME }}"
              SERVICE="${{ secrets.NP_WORKER_SERVICE }}"
              DB_SECRET_ARN="${{ secrets.NP_DATABASE_URL_SECRET_ARN }}"
              ENCRYPTION_SECRET_ARN="${{ secrets.NP_ENCRYPTION_SECRET_ARN }}"
              NEXTAUTH_SECRET_ARN="${{ secrets.NP_NEXTAUTH_SECRET_ARN }}"
              REDIS_SECRET_ARN="${{ secrets.NP_REDIS_SECRET_ARN }}"
              CLICKHOUSE_SECRET_ARN="${{ secrets.NP_CLICKHOUSE_SECRET_ARN }}"
              S3_SECRET_ARN="${{ secrets.NP_S3_SECRET_ARN }}"
              ;;
            prod)
              CLUSTER="${{ secrets.PROD_ECS_CLUSTER_NAME }}"
              SERVICE="${{ secrets.PROD_WORKER_SERVICE }}"
              DB_SECRET_ARN="${{ secrets.PROD_DATABASE_URL_SECRET_ARN }}"
              ENCRYPTION_SECRET_ARN="${{ secrets.PROD_ENCRYPTION_SECRET_ARN }}"
              NEXTAUTH_SECRET_ARN="${{ secrets.PROD_NEXTAUTH_SECRET_ARN }}"
              REDIS_SECRET_ARN="${{ secrets.PROD_REDIS_SECRET_ARN }}"
              CLICKHOUSE_SECRET_ARN="${{ secrets.PROD_CLICKHOUSE_SECRET_ARN }}"
              S3_SECRET_ARN="${{ secrets.PROD_S3_SECRET_ARN }}"
              ;;
          esac
          
          echo "CLUSTER=$CLUSTER" >> $GITHUB_OUTPUT
          echo "SERVICE=$SERVICE" >> $GITHUB_OUTPUT
          
          # Build secrets JSON
          jq -n \
            --arg db "$DB_SECRET_ARN" \
            --arg encryption "$ENCRYPTION_SECRET_ARN" \
            --arg nextauth "$NEXTAUTH_SECRET_ARN" \
            --arg redis "$REDIS_SECRET_ARN" \
            --arg clickhouse "$CLICKHOUSE_SECRET_ARN" \
            --arg s3 "$S3_SECRET_ARN" \
            '[
              {"name":"DATABASE_URL","valueFrom":$db},
              {"name":"ENCRYPTION_KEY","valueFrom":($encryption + ":encryption_key::")},
              {"name":"SALT","valueFrom":($encryption + ":salt::")},
              {"name":"NEXTAUTH_SECRET","valueFrom":($nextauth + ":secret::")},
              {"name":"REDIS_AUTH","valueFrom":($redis + ":password::")},
              {"name":"CLICKHOUSE_PASSWORD","valueFrom":($clickhouse + ":password::")},
              {"name":"LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID","valueFrom":($s3 + ":access_key::")},
              {"name":"LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY","valueFrom":($s3 + ":secret_key::")},
              {"name":"LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID","valueFrom":($s3 + ":access_key::")},
              {"name":"LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY","valueFrom":($s3 + ":secret_key::")},
              {"name":"LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID","valueFrom":($s3 + ":access_key::")},
              {"name":"LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY","valueFrom":($s3 + ":secret_key::")}
            ]' > worker-secrets.json
          
          echo "✅ Built secrets configuration"

      - name: Load environment variables from file
        run: |
          BRANCH="${{ needs.prepare.outputs.branch }}"
          ENV_FILE=".github/envs/${BRANCH}.env"
          
          if [ ! -f "$ENV_FILE" ]; then
            echo "❌ Env file not found: $ENV_FILE"
            exit 1
          fi
          
          # Parse env file to JSON - filter out comments and empty lines
          echo "[]" > env_vars.json
          while IFS='=' read -r key value; do
            # Skip comments and empty lines
            if [[ "$key" =~ ^#.* ]] || [ -z "$key" ]; then
              continue
            fi
            # Skip if no value
            if [ -z "$value" ]; then
              continue
            fi
            # Add to JSON array
            jq --arg k "$key" --arg v "$value" '. += [{"name": $k, "value": $v}]' env_vars.json > env_vars_tmp.json
            mv env_vars_tmp.json env_vars.json
          done < "$ENV_FILE"
          
          echo "✅ Loaded environment variables"

      - name: Update worker service
        run: |
          CLUSTER="${{ steps.ecs.outputs.CLUSTER }}"
          SERVICE="${{ steps.ecs.outputs.SERVICE }}"
          NEW_IMAGE="${{ steps.image.outputs.IMAGE }}"
          ENV="${{ env.ENVIRONMENT }}"
          BUILD="${{ github.run_number }}"
          
          # Get current task definition
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query taskDefinition > current-task-def.json
          
          # Load configs
          ENV_VARS_JSON=$(cat env_vars.json)
          SECRETS_JSON=$(cat worker-secrets.json)
          
          # Update task definition
          jq --arg IMG "$NEW_IMAGE" \
             --arg ENV "$ENV" \
             --arg BUILD "$BUILD" \
             --argjson ENV_VARS "$ENV_VARS_JSON" \
             --argjson SECRETS "$SECRETS_JSON" '
            .containerDefinitions = (.containerDefinitions | map(
              .image = $IMG |
              .environment = $ENV_VARS + [
                {"name":"APP_ENV","value":$ENV},
                {"name":"BUILD_NUMBER","value":$BUILD},
                {"name":"ENVIRONMENT","value":$ENV}
              ] |
              .secrets = $SECRETS
            )) |
            del(.taskDefinitionArn, .revision, .status, .registeredAt, .registeredBy, .compatibilities, .requiresAttributes, .placementConstraints)
          ' current-task-def.json > new-task-def.json
          
          # Register and update
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$NEW_TASK_DEF_ARN" \
            --force-new-deployment \
            --no-cli-pager
          
          echo "✅ Worker service updated"

  summary:
    name: 📊 Deployment Summary
    needs: [prepare, deploy-redis, deploy-clickhouse, deploy-minio, deploy-web, deploy-worker]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate deployment summary
        run: |
          echo "## 🚀 Langfuse Parallel Service Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Deployment Information" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`${{ needs.prepare.outputs.env }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Tag | \`${{ needs.prepare.outputs.image-tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ needs.prepare.outputs.branch }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Redis | \`${{ needs.deploy-redis.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ClickHouse | \`${{ needs.deploy-clickhouse.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| MinIO | \`${{ needs.deploy-minio.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Web | \`${{ needs.deploy-web.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Worker | \`${{ needs.deploy-worker.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ℹ️ Note" >> $GITHUB_STEP_SUMMARY
          echo "PostgreSQL is managed separately (RDS) and not deployed via ECS" >> $GITHUB_STEP_SUMMARY