name: Langfuse Parallel Service Deploy to ECS

on:
  push:
    branches:
      - chevvu/dev
      - chevvu/np
      - chevvu/prod
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - "*.config.js"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - np
          - prod

jobs:
  prepare:
    name: 🔧 Setup Environment
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.env.outputs.ENVIRONMENT }}
      image-tag: ${{ steps.tag.outputs.IMAGE_TAG }}
      branch: ${{ steps.env.outputs.BRANCH }}
    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
            BRANCH="chevvu/${ENV}"
            echo "ENVIRONMENT=${ENV}" >> $GITHUB_OUTPUT
            echo "BRANCH=${BRANCH}" >> $GITHUB_OUTPUT
            echo "🎯 Manual deployment to ${ENV} environment"
          else
            BR="${{ github.ref_name }}"
            case "$BR" in
              "chevvu/dev")
                echo "ENVIRONMENT=dev" >> $GITHUB_OUTPUT
                echo "BRANCH=${BR}" >> $GITHUB_OUTPUT
                ;;
              "chevvu/np")
                echo "ENVIRONMENT=np" >> $GITHUB_OUTPUT
                echo "BRANCH=${BR}" >> $GITHUB_OUTPUT
                ;;
              "chevvu/prod")
                echo "ENVIRONMENT=prod" >> $GITHUB_OUTPUT
                echo "BRANCH=${BR}" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "❌ Unknown branch $BR"
                exit 1
                ;;
            esac
            echo "🚀 Automatic deployment from branch ${BR}"
          fi

      - name: Compute image tag
        id: tag
        run: |
          IMAGE_TAG="${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy-redis:
    name: 🔴 Deploy Redis
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT: ${{ needs.prepare.outputs.env }}
      IMAGE_TAG: ${{ needs.prepare.outputs.image-tag }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.DEV_AWS_REGION }}

      - name: Get image URI
        id: image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION=$(aws configure get region || echo "us-east-1")
          ENV="${{ env.ENVIRONMENT }}"
          REPO="${ENV}-langfuse-redis"
          IMAGE="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${REPO}:latest"
          echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT
          echo "📦 Redis Image: $IMAGE"

      - name: Get ECS service details
        id: ecs
        run: |
          ENV="${{ env.ENVIRONMENT }}"
          case "$ENV" in
            dev)
              CLUSTER="${{ secrets.DEV_ECS_CLUSTER_NAME }}"
              SERVICE="${{ secrets.DEV_REDIS_SERVICE }}"
              REDIS_SECRET_ARN="${{ secrets.DEV_REDIS_SECRET_ARN }}"
              ;;
            np)
              CLUSTER="${{ secrets.NP_ECS_CLUSTER_NAME }}"
              SERVICE="${{ secrets.NP_REDIS_SERVICE }}"
              REDIS_SECRET_ARN="${{ secrets.NP_REDIS_SECRET_ARN }}"
              ;;
            prod)
              CLUSTER="${{ secrets.PROD_ECS_CLUSTER_NAME }}"
              SERVICE="${{ secrets.PROD_REDIS_SERVICE }}"
              REDIS_SECRET_ARN="${{ secrets.PROD_REDIS_SECRET_ARN }}"
              ;;
          esac
          
          echo "CLUSTER=$CLUSTER" >> $GITHUB_OUTPUT
          echo "SERVICE=$SERVICE" >> $GITHUB_OUTPUT
          echo "REDIS_SECRET_ARN=$REDIS_SECRET_ARN" >> $GITHUB_OUTPUT
          
          echo "🎯 Cluster: $CLUSTER"
          echo "🎯 Service: $SERVICE"

      - name: Get current task definition
        id: current-task
        run: |
          CLUSTER="${{ steps.ecs.outputs.CLUSTER }}"
          SERVICE="${{ steps.ecs.outputs.SERVICE }}"
          
          echo "🔍 Getting current task definition for $SERVICE..."
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          
          if [ -z "$TASK_DEF_ARN" ] || [ "$TASK_DEF_ARN" = "None" ]; then
            echo "❌ Task definition not found"
            exit 1
          fi
          
          echo "✅ Current task definition: $TASK_DEF_ARN"
          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Create task definition JSON
        run: |
          TASK_DEF_ARN="${{ steps.current-task.outputs.TASK_DEF_ARN }}"
          
          echo "📥 Downloading current task definition..."
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query taskDefinition > current-task-def.json

      - name: Update task definition with new image and secrets
        run: |
          NEW_IMAGE="${{ steps.image.outputs.IMAGE }}"
          REDIS_SECRET_ARN="${{ steps.ecs.outputs.REDIS_SECRET_ARN }}"
          ENV="${{ env.ENVIRONMENT }}"
          BUILD="${{ github.run_number }}"
          
          echo "🔧 Updating task definition..."
          echo "  Image: $NEW_IMAGE"
          echo "  Redis Secret: $REDIS_SECRET_ARN"
          
          # Create secrets JSON for Redis
          cat > redis-secrets.json <<EOF
          [
            {
              "name": "REDIS_PASSWORD",
              "valueFrom": "${REDIS_SECRET_ARN}:password::"
            }
          ]
          EOF
          
          SECRETS_JSON=$(cat redis-secrets.json)
          
          # Update task definition
          jq --arg IMG "$NEW_IMAGE" \
             --arg ENV "$ENV" \
             --arg BUILD "$BUILD" \
             --argjson SECRETS "$SECRETS_JSON" '
            .containerDefinitions = (.containerDefinitions | map(
              .image = $IMG |
              .environment = ((.environment // []) + [
                {"name": "ENVIRONMENT", "value": $ENV},
                {"name": "BUILD_NUMBER", "value": $BUILD}
              ]) |
              .secrets = $SECRETS
            )) |
            del(.taskDefinitionArn, .revision, .status, .registeredAt, .registeredBy, .compatibilities, .requiresAttributes, .placementConstraints)
          ' current-task-def.json > new-task-def.json
          
          echo "✅ Task definition updated"

      - name: Register new task definition
        id: register
        run: |
          echo "📝 Registering new task definition..."
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "✅ Registered: $NEW_TASK_DEF_ARN"
          echo "NEW_TASK_DEF_ARN=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Update ECS service
        run: |
          CLUSTER="${{ steps.ecs.outputs.CLUSTER }}"
          SERVICE="${{ steps.ecs.outputs.SERVICE }}"
          TASK_DEF="${{ steps.register.outputs.NEW_TASK_DEF_ARN }}"
          
          echo "🚀 Updating ECS service..."
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$TASK_DEF" \
            --force-new-deployment \
            --no-cli-pager
          
          echo "⏳ Waiting for service to stabilize..."
          if aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"; then
            echo "✅ Redis service is stable"
          else
            echo "⚠️ Wait timed out (service may still be updating)"
          fi

