      - name: Update task definition with new image and secrets
        run: |
          NEW_IMAGE="${{ steps.image.outputs.IMAGE }}"
          CH_SECRET_ARN="${{ steps.ecs.outputs.CH_SECRET_ARN }}"
          ENV="${{ env.ENVIRONMENT }}"
          BUILD="${{ github.run_number }}"
          
          echo "🔧 Updating task definition..."
          echo "  Image: $NEW_IMAGE"
          echo "  ClickHouse Secret: $CH_SECRET_ARN"
          
          # Create secrets JSON for ClickHouse
          cat > clickhouse-secrets.json <<EOF
          [
            {
              "name": "CLICKHOUSE_PASSWORD",
              "valueFrom": "${CH_SECRET_ARN}:password::"
            },
            {
              "name": "CLICKHOUSE_USER",
              "valueFrom": "${CH_SECRET_ARN}:username::"
            },
            {
              "name": "CLICKHOUSE_DB",
              "valueFrom": "${CH_SECRET_ARN}:database::"
            }
          ]
          EOF
          
          SECRETS_JSON=$(cat clickhouse-secrets.json)
          
          # Update task definition
          jq --arg IMG "$NEW_IMAGE" \
